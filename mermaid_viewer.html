<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Collapsible + Draggable Mermaid Diagrams</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .mermaid {
      display: inline-block;
      vertical-align: top;
    }

    .mermaid-viewer .viewer-area {
      display: inline-block;
      background: #fdfdfd;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 0.5em;
      vertical-align: top;
      overflow: hidden;
    }

    .mermaid-viewer .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5em 1em;
      background: #f9f9f9;
      border-bottom: 1px solid #ccc;
      width: 100%;
    }

    .mermaid-viewer .header-left {
      display: flex;
      align-items: center;
      gap: 0.5em;
      font-weight: bold;
    }

    .mermaid-viewer .buttons button {
      margin-left: 0.5em;
    }

    .mermaid-viewer .svg-wrapper {
      overflow: auto;
      background: #fff;
      cursor: grab;
      max-height: 100%;
      max-width: 100%;
      text-align: start;
      touch-action: none;
    }

    .mermaid-viewer .svg-wrapper.dragging {
      cursor: grabbing;
    }

    .mermaid-viewer .svg-container {
      display: block;
    }

    .mermaid-viewer .svg-scaler {
      display: inline-block;
      transform-origin: top left;
      transition: transform 0.2s;
    }

    .mermaid-viewer .svg-scaler svg {
      display: block;
      width: auto;
      height: auto;
    }

    .mermaid-viewer.fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      margin: 0 !important;
      padding: 0;
      z-index: 9999;
      background: #fff;
      border-radius: 0;
    }

    .mermaid-viewer.fullscreen .viewer-area {
      width: 100%;
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .mermaid-viewer.fullscreen .svg-wrapper {
      flex-grow: 1;
      max-width: none !important;
      max-height: none !important;
    }
  </style>
</head>

<body>
<h1 style="padding: 1em; text-align: center;">Mermaid Diagrams - Zoom + Collapse + Drag</h1>

<div style="text-align: center;">
  <div class="mermaid-source mermaid">
    graph TD
      A[Start] --> B{Is it working?}
      B -- Yes --> C[Great!]
      B -- No --> D[Fix it]
      D --> B
  </div>
</div>

<div style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap;">
  <div class="mermaid-source mermaid">
    graph TD
      A[Start] --> B{Is it working?}
      B -- Yes --> C[Great!]
      B -- No --> D[Fix it]
      D --> B
  </div>

  <div class="mermaid-source mermaid">
    graph TD
      X --> Y
      Y --> Z
      Z --> X
  </div>
</div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  mermaid.initialize({ startOnLoad: false });

  const DEBUG = true;
  const sources = document.querySelectorAll('.mermaid-source');
  const states = new Map();

  sources.forEach((source, index) => {
    const graphId = `mermaid-svg-${index}`;
    const wrapperId = `wrapper-${index}`;

    const viewerWrapper = document.createElement('div');
    viewerWrapper.classList.add('mermaid-viewer');

    const viewer = document.createElement('div');
    viewer.className = 'viewer-area';

    viewer.innerHTML = `
      <div class="header-bar">
        <div class="header-left">
          <button class="toggle-btn" data-open="true">▼</button>
          # ${index + 1}
        </div>
        <div class="buttons">
          <button class="toggle-fullscreen-btn" title="Toggle Fullscreen">⛶</button>
          <button data-action="in">🔍➕</button>
          <button data-action="out">🔍➖</button>
          <button data-action="reset">♻️</button>
          <button class="copy-png-btn" title="Copy as PNG">🖼️</button>
        </div>
      </div>
      <div class="svg-wrapper" id="${wrapperId}">
        <div class="svg-container">
          <div class="svg-scaler"></div>
        </div>
      </div>
    `;

    viewerWrapper.appendChild(viewer);

    const parent = source.parentElement;
    const sourceText = source.textContent.trim();
    parent.replaceChild(viewerWrapper, source);

    const svgWrapper = viewer.querySelector('.svg-wrapper');
    const svgScaler = viewer.querySelector('.svg-scaler');
    const buttons = viewer.querySelectorAll('[data-action]');
    const toggleBtn = viewer.querySelector('.toggle-btn');
    const fullscreenBtn = viewer.querySelector('.toggle-fullscreen-btn');
    const copyPngBtn = viewer.querySelector('.copy-png-btn');

    mermaid.render(graphId, sourceText).then(({ svg }) => {
      svgScaler.innerHTML = svg;

      const svgElement = svgScaler.querySelector('svg');

      if (!svgElement) return;

      svgElement.removeAttribute('height');
      svgElement.removeAttribute('width');

      requestAnimationFrame(() => {
        const box = getNaturalSvgBox(svgElement);

        if (!box || box.width < 1 || box.height < 1) return;

        const viewBox = svgElement.getAttribute('viewBox');

        if (!viewBox) {
          svgElement.setAttribute('viewBox', `${box.x} ${box.y} ${box.width} ${box.height}`);
        }

        svgElement.setAttribute('width', box.width);
        svgElement.setAttribute('height', box.height);
        svgElement.style.width = `${box.width}px`;
        svgElement.style.height = `${box.height}px`;

        const wrapperWidth = Math.max(svgWrapper.clientWidth, 1);
        const baseScale = wrapperWidth > 10 ? Math.min(1, wrapperWidth / box.width) : 1;

        states.set(viewer, {
          scale: baseScale,
          baseScale,
          width: box.width,
          height: box.height,
          x: box.x,
          y: box.y
        });

        applyScale(viewer);
      });
    });

    fullscreenBtn.addEventListener('click', () => {
      viewerWrapper.classList.toggle('fullscreen');
      requestAnimationFrame(() => applyScale(viewer));
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const state = states.get(viewer);

        if (!state) return;

        if (btn.dataset.action === 'in') {
          state.scale *= 1.2;
        } else if (btn.dataset.action === 'out') {
          state.scale /= 1.2;
        } else if (btn.dataset.action === 'reset') {
          state.scale = state.baseScale;
        }

        applyScale(viewer);
      });
    });

    copyPngBtn.addEventListener('click', () => {
      const svgElement = viewer.querySelector('svg');
      const state = states.get(viewer);

      if (!svgElement || !state) return;

      const svgClone = svgElement.cloneNode(true);
      svgClone.setAttribute('width', state.width);
      svgClone.setAttribute('height', state.height);
      svgClone.setAttribute('viewBox', `${state.x} ${state.y} ${state.width} ${state.height}`);

      const svgData = new XMLSerializer().serializeToString(svgClone);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(state.width * state.scale);
        canvas.height = Math.ceil(state.height * state.scale);

        const ctx = canvas.getContext('2d');

        if (!ctx) {
          URL.revokeObjectURL(url);
          return;
        }

        ctx.scale(state.scale, state.scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        canvas.toBlob(blob => {
          if (!blob) return;

          if (navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(() => {
              const original = copyPngBtn.textContent;
              copyPngBtn.textContent = '✔';
              setTimeout(() => copyPngBtn.textContent = original, 1000);
            }).catch(() => {
              downloadBlob(blob, `diagram-${index + 1}.png`);
            });
          } else {
            downloadBlob(blob, `diagram-${index + 1}.png`);
          }
        }, 'image/png');
      };

      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    });

    toggleBtn.addEventListener('click', () => {
      const isOpen = toggleBtn.getAttribute('data-open') === 'true';

      toggleBtn.setAttribute('data-open', (!isOpen).toString());
      toggleBtn.textContent = isOpen ? '▶' : '▼';
      svgWrapper.style.display = isOpen ? 'none' : 'block';

      if (!isOpen) {
        requestAnimationFrame(() => applyScale(viewer));
      }
    });

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let scrollLeft = 0;
    let scrollTop = 0;

    svgWrapper.addEventListener('pointerdown', e => {
      isDragging = true;
      svgWrapper.classList.add('dragging');
      svgWrapper.setPointerCapture(e.pointerId);

      startX = e.clientX;
      startY = e.clientY;
      scrollLeft = svgWrapper.scrollLeft;
      scrollTop = svgWrapper.scrollTop;
    });

    svgWrapper.addEventListener('pointerup', e => {
      isDragging = false;
      svgWrapper.classList.remove('dragging');

      if (svgWrapper.hasPointerCapture(e.pointerId)) {
        svgWrapper.releasePointerCapture(e.pointerId);
      }
    });

    svgWrapper.addEventListener('pointercancel', () => {
      isDragging = false;
      svgWrapper.classList.remove('dragging');
    });

    svgWrapper.addEventListener('pointermove', e => {
      if (!isDragging) return;

      e.preventDefault();

      svgWrapper.scrollLeft = scrollLeft - (e.clientX - startX);
      svgWrapper.scrollTop = scrollTop - (e.clientY - startY);
    });

    window.addEventListener('resize', () => applyScale(viewer));

    function applyScale(viewer) {
      const svgElement = viewer.querySelector('svg');
      const scaler = viewer.querySelector('.svg-scaler');
      const container = viewer.querySelector('.svg-container');
      const wrapper = viewer.querySelector('.svg-wrapper');
      const header = viewer.querySelector('.header-bar');
      const state = states.get(viewer);

      if (!svgElement || !scaler || !container || !wrapper || !header || !state) return;

      scaler.style.transform = `scale(${state.scale})`;
      scaler.style.width = `${state.width}px`;
      scaler.style.height = `${state.height}px`;

      container.style.width = `${state.width * state.scale}px`;
      container.style.height = `${state.height * state.scale}px`;

      if (viewerWrapper.classList.contains('fullscreen')) {
        viewer.style.width = '100%';
        viewer.style.height = '100%';
        viewer.style.maxWidth = 'none';
        viewer.style.maxHeight = 'none';
        wrapper.style.maxWidth = 'none';
        wrapper.style.maxHeight = 'none';
      } else {
        viewer.style.width = '';
        viewer.style.height = '';

        const viewerStyles = getComputedStyle(viewer);
        const marginTop = parseFloat(viewerStyles.marginTop) || 0;
        const marginBottom = parseFloat(viewerStyles.marginBottom) || 0;
        const marginLeft = parseFloat(viewerStyles.marginLeft) || 0;
        const marginRight = parseFloat(viewerStyles.marginRight) || 0;

        const windowHeight = window.innerHeight - marginTop - marginBottom;
        const windowWidth = window.innerWidth - marginLeft - marginRight;

        viewer.style.maxHeight = `${windowHeight}px`;
        viewer.style.maxWidth = `${windowWidth}px`;

        wrapper.style.maxHeight = `${Math.max(100, windowHeight - header.offsetHeight)}px`;
        wrapper.style.maxWidth = `${windowWidth}px`;
      }

      if (DEBUG) {
        console.groupCollapsed(`[ZOOM] Diagram ${graphId} @ scale ${state.scale.toFixed(2)}`);
        console.log(`natural:       ${state.width.toFixed(2)} x ${state.height.toFixed(2)}`);
        console.log(`container:     ${container.offsetWidth}px x ${container.offsetHeight}px`);
        console.log(`scaler:        ${scaler.offsetWidth}px x ${scaler.offsetHeight}px`);
        console.log(`svg-wrapper:   ${wrapper.offsetWidth}px x ${wrapper.offsetHeight}px`);
        console.log(`svg visible:   ${svgElement.getBoundingClientRect().width.toFixed(2)} x ${svgElement.getBoundingClientRect().height.toFixed(2)}`);
        console.groupEnd();
      }
    }

    function getNaturalSvgBox(svgElement) {
      const viewBox = svgElement.viewBox.baseVal;

      if (viewBox && viewBox.width > 0 && viewBox.height > 0) {
        return {
          x: viewBox.x,
          y: viewBox.y,
          width: viewBox.width,
          height: viewBox.height
        };
      }

      const gElement = svgElement.querySelector('g');

      try {
        if (gElement) {
          const box = gElement.getBBox();

          return {
            x: box.x,
            y: box.y,
            width: box.width,
            height: box.height
          };
        }

        const rect = svgElement.getBoundingClientRect();

        return {
          x: 0,
          y: 0,
          width: rect.width,
          height: rect.height
        };
      } catch {
        return null;
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = filename;
      a.click();

      URL.revokeObjectURL(url);
    }
  });
</script>
</body>
</html>
